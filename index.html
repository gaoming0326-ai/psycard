<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6c5ce7" />
  <title>PsyCard — 你的心理学记忆卡</title>
  <style>
    :root{--bg:#f6f7fb;--panel:#fff;--text:#1f2430;--muted:#6b7280;--line:#e8eaf1;--brand:#6c5ce7;--brand2:#8b7cf7;--good:#17a673;--bad:#e25555;--warn:#f2b84b;--shadow:0 14px 35px rgba(31,36,48,.10)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
    button,input,textarea,select{font:inherit} button{cursor:pointer}
    .app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
    .side{position:sticky;top:0;height:100vh;background:#171923;color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:18px}
    .brand{font-size:24px;font-weight:800;letter-spacing:-.5px;padding:8px 10px}.brand span{color:#a89cff}
    .deck-title{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#9ca3af;padding:0 10px}
    .deck-list{display:flex;flex-direction:column;gap:6px;overflow:auto}
    .deck-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:#e5e7eb;background:transparent;border:0;text-align:left;width:100%}
    .deck-item.active,.deck-item:hover{background:#252938}.deck-item b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.deck-item small{margin-left:auto;color:#9ca3af}
    .course-group{display:grid;gap:6px}.course-header,.unit-header{width:100%;border:0;background:transparent;color:#fff;text-align:left;display:flex;align-items:center;gap:8px;border-radius:10px;padding:9px 10px;font-weight:800}.course-header:hover,.unit-header:hover{background:#202432}.course-header{font-size:15px}.unit-group{margin-left:10px}.unit-header{font-size:13px;color:#cfd3df;padding:7px 9px}.unit-decks{margin-left:10px;display:grid;gap:4px}.folder-caret{width:14px;color:#9ca3af}.folder-empty{color:#7f8798;font-size:12px;padding:5px 12px 8px 28px}.deck-item{font-size:13px;padding:9px 10px}

    .side-footer{margin-top:auto;display:grid;gap:8px}.side button.secondary{background:#252938;color:#fff;border:1px solid #333849;padding:10px 12px;border-radius:12px}
    .main{padding:28px}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.top h1{margin:0;font-size:28px;letter-spacing:-.6px}.top .count{color:var(--muted)}
    .top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700}.btn.primary{background:var(--brand);color:#fff}.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.danger{background:#fff;color:var(--bad);border:1px solid #ffd7d7}
    .modebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.mode{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:999px;font-weight:700;color:#4b5563}.mode.active{background:#171923;color:#fff;border-color:#171923}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px}
    .grid{display:grid;gap:14px}.cards-grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
    .stat{padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}.stat b{font-size:24px;display:block}.stat span{color:var(--muted);font-size:13px}
    .flash-wrap{display:grid;place-items:center;min-height:480px}.flash{width:min(760px,100%);height:360px;perspective:1200px}.flash-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}.flash.flipped .flash-inner{transform:rotateY(180deg)}
    .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;font-size:30px;font-weight:750;box-shadow:var(--shadow);white-space:pre-wrap}.back{transform:rotateY(180deg);font-size:24px;font-weight:600;color:#333}.face-content{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;max-width:100%}.speak-btn{border:1px solid var(--line);background:#f8f8ff;color:var(--brand);width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;font-size:20px;box-shadow:0 5px 16px rgba(31,36,48,.08)}.speak-btn:hover{background:#f0eeff;border-color:#cbc5ff}.speak-inline{margin-left:8px;vertical-align:middle;width:36px;height:36px;font-size:17px}.speech-note{font-size:12px;color:var(--muted);font-weight:600}
    .flash-controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700}.good{color:var(--good)}.bad{color:var(--bad)}
    .progress{height:10px;border-radius:99px;background:#eceef4;overflow:hidden}.progress>div{height:100%;background:var(--brand);width:0;transition:.25s}
    .qbox{max-width:820px;margin:0 auto}.qtitle{font-size:26px;font-weight:800;line-height:1.35;margin:12px 0 20px}.options{display:grid;gap:10px}.option{border:1px solid var(--line);background:#fff;padding:14px 16px;border-radius:14px;text-align:left}.option:hover{border-color:#bcb4ff}.option.correct{border-color:#9be3c8;background:#f0fff9}.option.wrong{border-color:#ffc1c1;background:#fff5f5}
    .input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}.textarea{min-height:100px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{font-size:13px;font-weight:700;color:#4b5563;margin-bottom:6px}
    .card-row{display:grid;grid-template-columns:1fr 1fr 180px auto;gap:10px;align-items:start;padding:12px;border-bottom:1px solid var(--line)}.card-row:last-child{border-bottom:0}.card-row textarea{min-height:70px}.def-image{max-width:100%;max-height:220px;object-fit:contain;border-radius:14px;border:1px solid var(--line);background:#fafafa}.img-tools{display:grid;gap:8px}.img-preview{min-height:78px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;padding:8px;background:#fafafa}.exam-list{display:grid;gap:12px}.exam-card{padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}.exam-q{font-size:20px;font-weight:800;line-height:1.45}.exam-answer{margin-top:12px;padding:12px;border-radius:12px;background:#f7f7fb;border:1px solid var(--line);white-space:pre-wrap}.exam-editor-row{display:grid;grid-template-columns:1.3fr 1.3fr auto;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
    .empty{text-align:center;padding:48px;color:var(--muted)}.muted{color:var(--muted)}.hidden{display:none!important}.score{font-size:52px;font-weight:850;margin:6px 0}.review-item{padding:14px;border:1px solid var(--line);border-radius:14px;margin-top:10px}.review-item.ok{border-left:5px solid var(--good)}.review-item.no{border-left:5px solid var(--bad)}
    dialog{border:0;border-radius:20px;padding:0;max-width:min(900px,94vw);width:100%;box-shadow:0 30px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(17,24,39,.45)}.modal{padding:22px}.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}.modal-head h2{margin:0}.modal-head button{margin-left:auto}
    .toast{position:fixed;right:20px;bottom:20px;background:#171923;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:none}
    .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match-item{min-height:72px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left}.match-item.selected{outline:3px solid #d8d3ff}.match-item.done{opacity:.35;pointer-events:none}
    @media(max-width:820px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;padding:14px}.deck-title,.deck-list{display:none}.side-footer{display:flex;margin-top:0}.main{padding:16px}.top{align-items:flex-start;flex-wrap:wrap}.top-actions{margin-left:0;width:100%}.flash{height:330px}.face{font-size:25px;padding:26px}.back{font-size:21px}.form-row,.card-row{grid-template-columns:1fr}.modebar{overflow:auto;flex-wrap:nowrap;padding-bottom:3px}.mode{white-space:nowrap}.match-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Psy<span>Card</span></div>
    <div class="deck-title">课程目录</div>
    <div class="deck-list" id="deckList"></div>
    <div class="side-footer">
      <button class="secondary" id="newDeckBtn">＋ 新建卡组</button>
      <button class="secondary" id="backupBtn">↕ 备份 / 导入</button>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div><h1 id="deckName">PSYC Starter</h1><div class="count" id="deckMeta"></div></div>
      <div class="top-actions">
        <button class="btn ghost" id="shuffleBtn">🔀 随机顺序</button>
        <button class="btn ghost" id="soundBtn" title="开启或关闭学习音效">🔊 音效</button>
        <button class="btn ghost" id="editBtn">✏️ 编辑卡片</button>
        <button class="btn danger" id="deleteDeckBtn">删除卡组</button>
      </div>
    </div>

    <div class="modebar" id="modebar">
      <button class="mode active" data-mode="home">Overview</button>
      <button class="mode" data-mode="flash">Flashcards</button>
      <button class="mode" data-mode="learn">Learn</button>
      <button class="mode" data-mode="practice">Practice</button>
      <button class="mode" data-mode="test">Test</button>
      <button class="mode" data-mode="match">Match</button>
      <button class="mode" data-mode="mistakes">错题</button>
      <button class="mode" data-mode="exam">Exam 区域</button>
    </div>

    <section id="view"></section>
  </main>
</div>

<dialog id="deckDialog"><div class="modal"><div class="modal-head"><h2>新建 Lecture 卡组</h2><button class="btn ghost" onclick="deckDialog.close()">关闭</button></div><div class="form-row"><div><div class="label">课程</div><select id="newDeckCourse" class="input"><option>PSYC1002</option><option>PSYC2017</option></select></div><div><div class="label">Unit</div><input id="newDeckUnit" class="input" placeholder="例如：Neuroscience"></div></div><div style="height:12px"></div><div class="label">Lecture 名称</div><input id="newDeckName" class="input" placeholder="例如：Lecture 4 — Brain Methods"><div style="height:12px"></div><div class="label">批量导入（每行：Term<TAB>Definition）</div><textarea id="newDeckImport" class="input textarea" placeholder="Reliability\t信度；测量的一致性\nValidity\t效度；是否测到想测的内容"></textarea><div style="margin-top:14px"><button class="btn primary" id="createDeckConfirm">创建</button></div></div></dialog>

<dialog id="editDialog"><div class="modal"><div class="modal-head"><h2>编辑卡片</h2><button class="btn ghost" onclick="editDialog.close()">完成</button></div><div id="editRows"></div><button class="btn primary" id="addCardBtn" style="margin-top:14px">＋ 添加卡片</button></div></dialog>

<dialog id="examDialog"><div class="modal"><div class="modal-head"><h2>编辑 Exam 题目</h2><button class="btn ghost" onclick="examDialog.close()">完成</button></div><div id="examRows"></div><button class="btn primary" id="addExamBtn" style="margin-top:14px">＋ 添加考试题</button></div></dialog>

<dialog id="backupDialog"><div class="modal"><div class="modal-head"><h2>备份 / 导入</h2><button class="btn ghost" onclick="backupDialog.close()">关闭</button></div><div class="form-row"><div><div class="label">导出全部数据</div><button class="btn primary" id="exportJson">下载备份 JSON</button></div><div><div class="label">导入备份 JSON</div><input type="file" id="importJson" class="input" accept="application/json"></div></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="label">批量追加到当前卡组（Quizlet 导入格式）</div><textarea id="appendImport" class="input textarea" placeholder="Term<TAB>Definition"></textarea><button class="btn primary" id="appendBtn" style="margin-top:10px">追加卡片</button></div></dialog>
<div class="toast" id="toast"></div>

<script>
const COURSE_STRUCTURE={'PSYC1002':['Neuroscience'],'PSYC2017':[]};
const SEEDED_DECKS=[{"id":"psy1002-neuro-l4","course":"PSYC1002","unit":"Neuroscience","name":"Lecture 4 — Brain Methods & Feeding","cards":[{"id":"l4-c1","term":"Brain lesion","def":"Damage to brain tissue used to examine whether a particular brain region is necessary for a behaviour or psychological function. Human lesions may occur accidentally, whereas animal lesions can be produced experimentally.","image":"","imageHint":"Brain lesion location diagram"},{"id":"l4-c2","term":"Necessary brain region","def":"A brain region is considered necessary for a function when damaging or inhibiting it impairs that function. Observing activation alone does not establish necessity.","image":"","imageHint":""},{"id":"l4-c3","term":"Transcranial Magnetic Stimulation (TMS)","def":"A non-invasive method that uses a magnetic pulse to produce an electrical current in the brain, changing neuronal activity and potentially producing action potentials. Because researchers manipulate brain activity, TMS can provide causal evidence.","image":"","imageHint":"TMS coil positioned over the cortex"},{"id":"l4-c4","term":"Electrophysiology","def":"A method that uses electrodes to record the electrical activity of neurons. It has excellent temporal precision, but recording activity alone usually demonstrates an association rather than a causal relationship.","image":"","imageHint":"Intracranial electrode recording a neuron"},{"id":"l4-c5","term":"Fibre photometry","def":"A method that measures changes in calcium-related fluorescence as an indicator of activity in a population of neurons.","image":"","imageHint":"Fibre-photometry setup"},{"id":"l4-c6","term":"Chemogenetics","def":"A method that genetically introduces specially designed receptors into selected neurons. These receptors can then be activated by a designer drug to alter neuronal activity.","image":"","imageHint":"DREADDs chemogenetic diagram"},{"id":"l4-c7","term":"DREADDs","def":"Designer Receptors Exclusively Activated by Designer Drugs. They allow selected neurons to be activated or inhibited through chemogenetic manipulation.","image":"","imageHint":"Designer receptor and designer drug diagram"},{"id":"l4-c8","term":"Optogenetics","def":"A method that introduces light-sensitive opsins into selected neurons so that their activity can be controlled using light. It provides precise control over particular neuronal populations.","image":"","imageHint":"Optogenetic fibre and light-sensitive neurons"},{"id":"l4-c9","term":"Chemogenetics vs optogenetics","def":"Chemogenetics controls genetically selected neurons using a designer drug, whereas optogenetics controls genetically selected neurons using light. Optogenetics provides more rapid temporal control.","image":"","imageHint":"Side-by-side chemogenetics and optogenetics diagram"},{"id":"l4-c10","term":"Functional brain imaging","def":"Methods used to measure which brain areas become active during a psychological function. Functional imaging identifies correlations between brain activity and behaviour but does not, by itself, prove causation.","image":"","imageHint":""},{"id":"l4-c11","term":"Electroencephalography (EEG)","def":"A non-invasive method in which electrodes placed against the scalp record electrical fields generated by brain activity. EEG has excellent temporal resolution but poor spatial resolution.","image":"","imageHint":"EEG electrode cap"},{"id":"l4-c12","term":"Temporal resolution","def":"The ability of a method to identify when brain activity occurs. EEG and MEG have excellent temporal resolution because they detect rapid changes in neural activity.","image":"","imageHint":""},{"id":"l4-c13","term":"Spatial resolution","def":"The ability of a method to identify where brain activity occurs. fMRI has better spatial resolution than EEG.","image":"","imageHint":""},{"id":"l4-c14","term":"Magnetic Resonance Imaging (MRI)","def":"A structural imaging method that uses radio-frequency waves within a strong magnetic field to measure the orientation of protons in water, allowing different types of brain tissue to be visualised.","image":"","imageHint":"Structural MRI brain scan"},{"id":"l4-c15","term":"Functional Magnetic Resonance Imaging (fMRI)","def":"A functional imaging method that measures blood-oxygen changes through the BOLD response. It has good spatial resolution, but its temporal resolution is limited because blood-flow changes lag behind neural activity.","image":"","imageHint":"fMRI activation map"},{"id":"l4-c16","term":"BOLD response","def":"Blood-Oxygen-Level-Dependent response. It reflects differences in the magnetic properties of oxygen-rich and oxygen-depleted blood and is used by fMRI as an indirect measure of brain activity.","image":"","imageHint":"BOLD response diagram"},{"id":"l4-c17","term":"Magnetoencephalography (MEG)","def":"A non-invasive method that measures magnetic fields generated by brain activity and reconstructs a functional map. It has excellent temporal and good spatial resolution but is extremely expensive and sensitive to electromagnetic interference.","image":"","imageHint":"MEG scanner"},{"id":"l4-c18","term":"Correlation between brain activity and behaviour","def":"If activity in a brain region changes during a task, the region is associated with that function. This observation does not prove that the brain region causes or is necessary for the function.","image":"","imageHint":""},{"id":"l4-c19","term":"Causal brain evidence","def":"Evidence produced by manipulating, damaging or inhibiting a brain region and observing a resulting behavioural change. Lesions, TMS, optogenetics and chemogenetics can provide causal evidence when appropriately designed.","image":"","imageHint":""},{"id":"l4-c20","term":"Lateral hypothalamus (LH)","def":"A hypothalamic region that promotes feeding. Destruction of the lateral hypothalamus causes rats to reduce eating dramatically.","image":"","imageHint":"Hypothalamus diagram highlighting LH"},{"id":"l4-c21","term":"Ventromedial hypothalamus (VMH)","def":"A hypothalamic region involved in suppressing feeding. Destruction of the VMH causes rats to overeat.","image":"","imageHint":"Hypothalamus diagram highlighting VMH"},{"id":"l4-c22","term":"Paraventricular nucleus (PVN)","def":"A hypothalamic nucleus that integrates hunger and fullness signals to regulate appetite.","image":"","imageHint":"Hypothalamus diagram highlighting PVN"},{"id":"l4-c23","term":"Arcuate nucleus (Arc)","def":"A hypothalamic nucleus containing two functionally different classes of neurons: one promotes feeding through the LH, while the other suppresses feeding through the VMH and PVN.","image":"","imageHint":"Hypothalamus diagram highlighting the arcuate nucleus"},{"id":"l4-c24","term":"Arcuate nucleus and the blood-brain barrier","def":"The arcuate nucleus has a relatively leaky blood-brain barrier, allowing its neurons to detect circulating signals from the gut and fat tissue.","image":"","imageHint":"Arcuate nucleus beside blood vessels"},{"id":"l4-c25","term":"Ghrelin","def":"A hormone from the gut detected by receptors in the arcuate nucleus. It provides information relevant to hunger and feeding regulation.","image":"","imageHint":""},{"id":"l4-c26","term":"Leptin","def":"A hormone released by fat tissue and detected by receptors in the arcuate nucleus. It provides information about the body’s stored energy.","image":"","imageHint":""},{"id":"l4-c27","term":"Insulin in feeding regulation","def":"A circulating hormone detected by receptors in the arcuate nucleus, contributing information about the body’s current metabolic state.","image":"","imageHint":""}],"stats":{"seen":{},"correct":{},"wrong":{},"mistakes":[]},"exams":[{"id":"l4-q1","q":"What methods can be used to show that a brain region is necessary for a psychological function?","answer":"Researchers can damage or inhibit the region and test whether the function becomes impaired. Relevant methods include accidental or experimental lesions, disruptive TMS, and inhibitory optogenetic or chemogenetic manipulations."},{"id":"l4-q2","q":"Explain why observing fMRI activation does not prove that a brain region causes a behaviour.","answer":"fMRI identifies a correlation between a BOLD response and behaviour. The activated region may contribute to the behaviour, respond to it, or be activated by another process. No brain activity has been directly manipulated."},{"id":"l4-q3","q":"Compare the temporal and spatial resolution of EEG and fMRI.","answer":"EEG has excellent temporal resolution but poor spatial resolution, so it identifies when activity occurs more effectively than where it occurs. fMRI has good spatial resolution but poorer temporal resolution because the BOLD response lags behind neural activity."},{"id":"l4-q4","q":"Compare MRI and fMRI.","answer":"MRI visualises brain structure by distinguishing different types of tissue. fMRI estimates functional activity by measuring changes in blood oxygen through the BOLD response."},{"id":"l4-q5","q":"Compare optogenetics and chemogenetics.","answer":"Both methods control genetically selected neurons and can provide causal evidence. Optogenetics uses light-sensitive opsins and provides rapid control, whereas chemogenetics uses designer receptors activated by a designer drug."},{"id":"l4-q6","q":"What are the principal strengths and weaknesses of MEG?","answer":"MEG is non-invasive and has excellent temporal and good spatial resolution. Its main weaknesses are its very high cost and extreme sensitivity to electromagnetic interference."},{"id":"l4-q7","q":"An EEG study finds increased electrical activity during a memory task. What can and cannot be concluded?","answer":"The result supports an association between recorded brain activity and memory-task performance. It does not establish that the recorded activity causes or is necessary for memory."},{"id":"l4-q8","q":"A rat dramatically reduces its eating after damage to one hypothalamic region. Which region was probably damaged, and what does the result suggest?","answer":"The lateral hypothalamus was probably damaged. The result suggests that the LH is necessary for the normal promotion of feeding."},{"id":"l4-q9","q":"A rat overeats after an experimental brain lesion. Which hypothalamic region was probably damaged?","answer":"The ventromedial hypothalamus was probably damaged because VMH destruction causes rats to overeat."},{"id":"l4-q10","q":"Compare the feeding functions of the LH and VMH.","answer":"The LH promotes feeding, whereas the VMH participates in suppressing feeding. LH destruction reduces eating, while VMH destruction produces overeating."},{"id":"l4-q11","q":"Explain how the arcuate nucleus regulates feeding.","answer":"The arcuate nucleus detects circulating signals such as ghrelin, insulin and leptin. It contains neurons that promote feeding through the LH and neurons that suppress feeding through the VMH and PVN."},{"id":"l4-q12","q":"Why is the arcuate nucleus well positioned to monitor the body’s metabolic state?","answer":"It has a relatively leaky blood-brain barrier, and its neurons contain receptors for hormones from the gut and fat tissue."},{"id":"l4-q13","q":"Explain the role of the paraventricular nucleus in feeding.","answer":"The PVN integrates hunger and fullness signals and uses this combined information to help regulate appetite."}]},{"id":"psy1002-neuro-l5","course":"PSYC1002","unit":"Neuroscience","name":"Lecture 5 — Sleep, Wakefulness and Reward","cards":[{"id":"l5-c1","term":"Sleep deprivation","def":"Insufficient sleep impairs attention, processing speed, memory and mood. Sleep disturbance is also associated with metabolic, psychological and cardiovascular problems.","image":"","imageHint":""},{"id":"l5-c2","term":"Sleep and psychological disorders","def":"Many DSM-5 diagnoses involve too much or too little sleep. The direction of causality is not always clear because psychological disorders may disturb sleep, sleep disturbance may worsen symptoms, or both may occur.","image":"","imageHint":""},{"id":"l5-c3","term":"Sleep and metabolic health","def":"Sleep disturbance affects ghrelin, leptin and responsiveness to insulin, linking inadequate sleep with altered eating, obesity and diabetes.","image":"","imageHint":""},{"id":"l5-c4","term":"Sleep deprivation and sympathetic activity","def":"Lack of sleep increases sympathetic nervous system activity, which can place additional strain on the cardiovascular system.","image":"","imageHint":""},{"id":"l5-c5","term":"Brainstem arousal systems","def":"Brainstem neurons containing noradrenaline, serotonin and acetylcholine promote arousal. These neurons are active during wakefulness and relatively quiet during sleep.","image":"","imageHint":"Brainstem arousal-system diagram"},{"id":"l5-c6","term":"Locus coeruleus","def":"A brainstem nucleus containing noradrenaline neurons that contribute to arousal and wakefulness.","image":"","imageHint":"Brainstem diagram highlighting the locus coeruleus"},{"id":"l5-c7","term":"Raphe nuclei","def":"Brainstem nuclei containing serotonin neurons that contribute to arousal and wakefulness.","image":"","imageHint":"Brainstem diagram highlighting the raphe nuclei"},{"id":"l5-c8","term":"Pons and arousal","def":"Acetylcholine neurons in the pons contribute to arousal. Pontine acetylcholine neurons also play an important role in generating REM sleep.","image":"","imageHint":"Brainstem diagram highlighting the pons"},{"id":"l5-c9","term":"Decerebration and sleep","def":"Disconnecting the forebrain from the brainstem produces profound and nearly continuous sleep, demonstrating the importance of brainstem systems for maintaining arousal.","image":"","imageHint":"Forebrain-brainstem disconnection diagram"},{"id":"l5-c10","term":"Preoptic area","def":"A region of the anterior hypothalamus that promotes sleep. Destruction can cause insomnia, whereas stimulation can induce sleep.","image":"","imageHint":"Brain diagram highlighting the preoptic area"},{"id":"l5-c11","term":"GABA in the preoptic area","def":"Preoptic-area neurons release GABA to inhibit the acetylcholine, serotonin and noradrenaline arousal systems in the brainstem, thereby promoting sleep.","image":"","imageHint":"Preoptic area inhibiting brainstem arousal centres"},{"id":"l5-c12","term":"Sleep pressure","def":"The increasing biological drive to sleep that develops across time spent awake. It is produced partly by the accumulation of adenosine in the brain.","image":"","imageHint":""},{"id":"l5-c13","term":"Adenosine","def":"A substance that accumulates in the brain during wakefulness. It increases sleep pressure by inhibiting alertness centres, especially the pontine acetylcholine system, and stimulating the preoptic sleep centre.","image":"","imageHint":"Adenosine accumulation across waking time"},{"id":"l5-c14","term":"Caffeine","def":"A stimulant that reduces the effects of sleep pressure by blocking adenosine receptors. It blocks adenosine signalling rather than eliminating the underlying need for sleep.","image":"","imageHint":"Caffeine blocking an adenosine receptor"},{"id":"l5-c15","term":"Suprachiasmatic nucleus (SCN)","def":"A hypothalamic nucleus that controls the circadian cycle and regulates the release of melatonin from the pineal gland.","image":"","imageHint":"Brain diagram highlighting the SCN"},{"id":"l5-c16","term":"Circadian rhythm","def":"An approximately 24-hour biological cycle regulated by the SCN. It coordinates daily changes in sleep, wakefulness and melatonin release.","image":"","imageHint":"Twenty-four-hour circadian rhythm graph"},{"id":"l5-c17","term":"Melatonin","def":"A hormone released by the pineal gland under the control of the SCN. It signals night-time to the rest of the body.","image":"","imageHint":"Circadian melatonin graph"},{"id":"l5-c18","term":"Sleep pressure vs circadian rhythm","def":"Sleep pressure increases with time spent awake through adenosine accumulation, whereas the circadian rhythm is a time-of-day signal controlled by the SCN.","image":"","imageHint":"Two-process sleep regulation graph"},{"id":"l5-c19","term":"Beta waves","def":"High-frequency, low-amplitude and relatively irregular brain activity associated with alert wakefulness.","image":"","imageHint":"Beta EEG waveform"},{"id":"l5-c20","term":"Alpha waves","def":"Larger and more regular brain waves that may appear when a person is awake but relaxed with their eyes closed.","image":"","imageHint":"Alpha EEG waveform"},{"id":"l5-c21","term":"Theta waves","def":"Slower brain waves associated mainly with Stage 1 and Stage 2 light sleep. Stage 2 also includes sleep spindles and K-complexes.","image":"","imageHint":"Theta waveform with sleep spindle and K-complex"},{"id":"l5-c22","term":"Sleep spindles","def":"Brief bursts of relatively rapid brain-wave activity that occur during Stage 2 sleep.","image":"","imageHint":"EEG sleep spindle"},{"id":"l5-c23","term":"K-complex","def":"A large, distinctive EEG waveform that occurs during Stage 2 sleep and distinguishes it from Stage 1 sleep.","image":"","imageHint":"EEG K-complex"},{"id":"l5-c24","term":"Delta waves","def":"Very slow, high-amplitude brain waves associated with Stage 3 deep sleep. Delta activity reflects highly synchronised neural activity.","image":"","imageHint":"Delta EEG waveform"},{"id":"l5-c25","term":"Slow-wave sleep","def":"Deep sleep characterised by slow, rhythmic and highly synchronised brain activity, especially delta waves.","image":"","imageHint":"Stage 3 slow-wave EEG"},{"id":"l5-c26","term":"Thalamocortical synchronisation","def":"Reciprocal connections between the thalamus and cortex coordinate the synchronised neural activity observed during slow-wave sleep.","image":"","imageHint":"Thalamus-cortex connection diagram"},{"id":"l5-c27","term":"Rapid Eye Movement (REM) sleep","def":"A sleep stage characterised by rapid eye movements, desynchronised brain waves resembling wakefulness, frequent dream reports and paralysis of most skeletal muscles.","image":"","imageHint":"REM sleep diagram"},{"id":"l5-c28","term":"REM across the night","def":"REM periods become more frequent as the night progresses, while deep slow-wave sleep is more prominent earlier in the night.","image":"","imageHint":"Overnight sleep-cycle graph"},{"id":"l5-c29","term":"REM across the lifespan","def":"REM sleep decreases across the lifespan. It accounts for approximately 50% of a newborn’s sleep but about 20% of an adult’s sleep.","image":"","imageHint":"REM percentage across age graph"},{"id":"l5-c30","term":"Pontine acetylcholine neurons in REM","def":"Acetylcholine neurons in the pons generate REM activity by stimulating thalamic neurons that project to the visual cortex.","image":"","imageHint":"Pons-thalamus-visual cortex pathway"},{"id":"l5-c31","term":"Brain activity during REM","def":"Visual areas, motor regions and the limbic system become highly active during REM, especially the amygdala and cingulate cortex. Activity in the lateral prefrontal cortex is suppressed.","image":"","imageHint":"fMRI map of REM brain activity"},{"id":"l5-c32","term":"Lateral prefrontal cortex during REM","def":"Activity in the lateral prefrontal cortex is suppressed during REM sleep. Because this region supports logical reasoning and self-control, its reduced activity may help explain the illogical character of dreams.","image":"","imageHint":"Brain diagram highlighting the lateral prefrontal cortex"},{"id":"l5-c33","term":"REM muscle paralysis","def":"During REM, pontine acetylcholine neurons activate medullary neurons that ultimately inhibit motor neurons in the spinal cord, producing paralysis of most skeletal muscles.","image":"","imageHint":"Pons-medulla-spinal cord REM pathway"},{"id":"l5-c34","term":"Reward","def":"A consequence that motivates an organism to perform a behaviour. Animals, including humans, learn actions that allow them to obtain rewards.","image":"","imageHint":""},{"id":"l5-c35","term":"Olds and Milner","def":"Researchers who discovered electrical brain self-stimulation after accidentally implanting an electrode in a rat’s medial forebrain bundle.","image":"","imageHint":"Olds and Milner self-stimulation experiment"},{"id":"l5-c36","term":"Electrical brain self-stimulation","def":"A procedure in which an animal performs an action, such as pressing a lever, to receive electrical stimulation of a brain reward pathway.","image":"","imageHint":"Rat pressing a lever for brain stimulation"},{"id":"l5-c37","term":"Medial forebrain bundle (MFB)","def":"A bundle of noradrenaline and dopamine fibres travelling from the brainstem to the forebrain. Electrical stimulation of the MFB produces a powerful rewarding effect.","image":"","imageHint":"Medial forebrain bundle pathway"},{"id":"l5-c38","term":"Dopamine and reward","def":"Dopamine axons in the medial forebrain bundle make the greatest contribution to the rewarding effect of electrical stimulation. Destroying these fibres substantially reduces the effect.","image":"","imageHint":"Dopamine reward pathway"},{"id":"l5-c39","term":"Primary reward pathway","def":"A major reward pathway involves dopamine neurons in the VTA projecting through the medial forebrain bundle to the nucleus accumbens.","image":"","imageHint":"VTA-MFB-nucleus accumbens pathway"},{"id":"l5-c40","term":"Ventral tegmental area (VTA)","def":"A midbrain region containing dopamine neurons that project through the medial forebrain bundle to forebrain reward regions, including the nucleus accumbens.","image":"","imageHint":"Brain diagram highlighting the VTA"},{"id":"l5-c41","term":"Nucleus accumbens","def":"A forebrain reward region that receives dopamine input from the VTA. Rats will perform actions to receive injections of amphetamines or opiates into this region.","image":"","imageHint":"Brain diagram highlighting the nucleus accumbens"},{"id":"l5-c42","term":"Addictive drugs and dopamine","def":"Amphetamines and cocaine directly increase dopamine transmission in the reward pathway, while heroin and nicotine increase dopamine release indirectly.","image":"","imageHint":"Addictive drugs affecting dopamine release"},{"id":"l5-c43","term":"Substance use disorder and the reward pathway","def":"Substance use disorder involves the reward pathway because addictive drugs increase dopamine transmission and strongly reinforce repeated drug-seeking and drug-taking behaviour.","image":"","imageHint":"Reward pathway and addictive drugs"}],"stats":{"seen":{},"correct":{},"wrong":{},"mistakes":[]},"exams":[{"id":"l5-q1","q":"Identify four health risks or consequences associated with sleep deprivation.","answer":"Sleep deprivation impairs cognition and mood, disrupts ghrelin, leptin and insulin responsiveness, is associated with obesity and diabetes, and increases sympathetic nervous system activity that can affect cardiovascular health."},{"id":"l5-q2","q":"Why should the relationship between sleep disturbance and psychological disorders not automatically be interpreted causally?","answer":"The direction of causality is unclear. Psychological disorders may disturb sleep, sleep disturbance may worsen psychological symptoms, or both may influence each other."},{"id":"l5-q3","q":"Name the three brainstem arousal systems and their main neurotransmitters.","answer":"The locus coeruleus uses noradrenaline, the raphe nuclei use serotonin, and neurons in the pons use acetylcholine."},{"id":"l5-q4","q":"What does the decerebration finding suggest about wakefulness?","answer":"Disconnecting the forebrain from the brainstem produces profound and nearly continuous sleep. This suggests that brainstem arousal systems are important for maintaining wakefulness."},{"id":"l5-q5","q":"Explain how the preoptic area promotes sleep.","answer":"GABA neurons in the preoptic area inhibit the acetylcholine, serotonin and noradrenaline arousal systems in the brainstem, reducing arousal and promoting sleep."},{"id":"l5-q6","q":"Explain the mechanism that produces sleep pressure.","answer":"Adenosine accumulates in the brain while a person is awake. It increases sleepiness by inhibiting alertness centres, especially the pontine acetylcholine system, and stimulating the preoptic sleep centre."},{"id":"l5-q7","q":"How does caffeine reduce sleepiness?","answer":"Caffeine blocks adenosine receptors, preventing accumulated adenosine from producing its normal sleep-promoting effects."},{"id":"l5-q8","q":"Compare sleep pressure and circadian rhythm.","answer":"Sleep pressure increases according to how long a person has been awake and is associated with adenosine accumulation. Circadian rhythm depends on time of day and is controlled by the SCN."},{"id":"l5-q9","q":"Explain how the SCN helps regulate the sleep-wake cycle.","answer":"The SCN controls circadian timing and regulates melatonin release from the pineal gland. Melatonin signals night-time to the rest of the body."},{"id":"l5-q10","q":"Match beta, alpha, theta and delta waves to their principal behavioural states.","answer":"Beta is associated with alert wakefulness, alpha with relaxed wakefulness and closed eyes, theta with Stage 1 and Stage 2 light sleep, and delta with Stage 3 deep sleep."},{"id":"l5-q11","q":"What EEG features distinguish Stage 2 sleep from Stage 1 sleep?","answer":"Both stages can contain theta activity, but Stage 2 is distinguished by sleep spindles and K-complexes."},{"id":"l5-q12","q":"Explain why REM sleep is sometimes described as paradoxical.","answer":"During REM, brain waves are active and desynchronised like wakefulness, yet the individual remains asleep and most skeletal muscles are paralysed."},{"id":"l5-q13","q":"Describe four characteristics of REM sleep.","answer":"REM includes rapid eye movements, desynchronised brain waves resembling wakefulness, frequent vivid dreaming and paralysis of most skeletal muscles."},{"id":"l5-q14","q":"How does REM sleep change across one night and across the lifespan?","answer":"REM periods become more frequent as the night progresses. The proportion of sleep spent in REM declines from approximately 50% in newborns to approximately 20% in adults."},{"id":"l5-q15","q":"Explain the neural mechanism that generates REM sleep.","answer":"Acetylcholine neurons in the pons stimulate neurons in the thalamus, which project to the visual cortex and contribute to the activated brain pattern of REM sleep."},{"id":"l5-q16","q":"Explain how muscle paralysis is produced during REM sleep.","answer":"Acetylcholine neurons in the pons activate neurons in the medulla. These neurons ultimately inhibit motor neurons in the spinal cord, preventing most skeletal movement."},{"id":"l5-q17","q":"During REM, why can dreams be highly visual and emotional but logically unusual?","answer":"Visual regions and limbic areas, including the amygdala and cingulate cortex, are highly active. At the same time, the lateral prefrontal cortex involved in logical reasoning and self-control is suppressed."},{"id":"l5-q18","q":"How did Olds and Milner discover the brain’s reward system?","answer":"They accidentally implanted an electrode in a rat’s medial forebrain bundle. The rat returned to the place where it had received stimulation and later learned to press a lever repeatedly to obtain the stimulation."},{"id":"l5-q19","q":"What behaviour showed that medial forebrain bundle stimulation was strongly rewarding?","answer":"Rats repeatedly pressed a lever to receive the stimulation, sometimes neglecting food or tolerating floor shocks to continue self-stimulating."},{"id":"l5-q20","q":"Describe the brain’s primary reward pathway.","answer":"Dopamine neurons in the VTA project through the medial forebrain bundle to the nucleus accumbens. Dopamine is the principal neurotransmitter involved in the rewarding effect described in the lecture."},{"id":"l5-q21","q":"What evidence indicates that dopamine contributes to the rewarding effect of medial forebrain bundle stimulation?","answer":"Dopamine axons make the greatest contribution to the effect, and destruction of dopamine fibres substantially reduces the rewarding value of the stimulation."},{"id":"l5-q22","q":"Compare how amphetamines or cocaine and heroin or nicotine affect the reward pathway.","answer":"Amphetamines and cocaine directly enhance dopamine transmission, whereas heroin and nicotine indirectly increase dopamine release."},{"id":"l5-q23","q":"A rat repeatedly presses a lever to receive amphetamine injections into the nucleus accumbens. How should this result be interpreted?","answer":"The drug injection functions as a reward and reinforces lever pressing. The result supports the role of the nucleus accumbens and dopamine-related signalling in reward-motivated behaviour."},{"id":"l5-q24","q":"Name one behavioural disorder involving the reward pathway and explain the connection.","answer":"Substance use disorder involves this pathway because addictive drugs increase dopamine transmission and reinforce repeated drug-seeking and drug-taking behaviour."}]}];

function getFlashOrder(d){if(!session.flash || session.flash.deckId!==d.id){session.flash={deckId:d.id,order:[...d.cards],i:0,flipped:false}}return session.flash}
function renderFlash(v,d){const s=getFlashOrder(d);if(!s.order.length){v.innerHTML='<div class="panel empty">这个卡组还没有卡片。</div>';return}if(s.finished||s.i>=s.order.length){s.finished=true;v.innerHTML=`<div class="panel qbox"><h2>Flashcards 完成 ✓</h2><p class="muted">所有卡片都看过一遍了。下一步进入 Learn：卡片会随机打乱，并随机从 Term 或 Definition 开始。</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn primary" id="goLearn">继续 Learn →</button><button class="btn ghost" onclick="setMode('home')">返回 Overview</button><button class="btn ghost" id="redoFlash">再看一遍 Flashcards</button></div></div>`;document.getElementById('goLearn').onclick=()=>{session.learn={deckId:d.id,queue:shuffle(d.cards).map((c,i)=>({card:c,side:i%2===0?'term':'def'})),i:0,flipped:false,finished:false};setMode('learn')};document.getElementById('redoFlash').onclick=()=>{session.flash={deckId:d.id,order:[...d.cards],i:0,flipped:false,finished:false};render()};return}const c=s.order[s.i];v.innerHTML=`<div class="flash-wrap"><div style="width:min(760px,100%)"><div class="progress"><div style="width:${((s.i+1)/s.order.length)*100}%"></div></div><div class="muted" style="margin:10px 0;text-align:center">${s.i+1} / ${s.order.length} · 点击卡片翻面</div><div class="flash ${s.flipped?'flipped':''}" id="flashCard"><div class="flash-inner"><div class="face front"><div class="face-content"><div>${esc(c.term)}</div>${speakerButton(c.term)}<div class="speech-note">American English</div></div></div><div class="face back"><div class="face-content"><div>${esc(c.def)}</div>${c.image?`<img class="def-image" src="${c.image}" alt="Definition image">`:''}${speakerButton(c.term)}<div class="speech-note">播放术语读音</div></div></div></div></div><div class="flash-controls"><button class="pill" id="prev">← 上一张</button><button class="pill" id="next">${s.i===s.order.length-1?'完成 Flashcards →':'下一张 →'}</button></div></div></div>`;bindSpeakers(v);document.getElementById('flashCard').onclick=()=>{playSound('flip');s.flipped=!s.flipped;render()};document.getElementById('prev').onclick=()=>{if(s.i>0)s.i--;s.flipped=false;render()};document.getElementById('next').onclick=()=>{s.i++;s.flipped=false;if(s.i>=s.order.length)s.finished=true;render()}}
function mark(c,ok,d){playSound(ok?'correct':'wrong');ensureStats(d);d.stats.seen[c.id]=(d.stats.seen[c.id]||0)+1;if(ok){d.stats.correct[c.id]=(d.stats.correct[c.id]||0)+1;d.stats.mistakes=d.stats.mistakes.filter(x=>x!==c.id)}else{d.stats.wrong[c.id]=(d.stats.wrong[c.id]||0)+1;if(!d.stats.mistakes.includes(c.id))d.stats.mistakes.push(c.id)}save()}
function mkMCQ(card,d){const wrong=shuffle(d.cards.filter(x=>x.id!==card.id)).slice(0,3).map(x=>x.def);return shuffle([card.def,...wrong])}
function renderLearn(v,d){let s=session.learn;if(!s||s.deckId!==d.id){session.learn=s={deckId:d.id,queue:shuffle(d.cards).map((c,i)=>({card:c,side:i%2===0?'term':'def'})),i:0,flipped:false,finished:false}}if(s.finished||s.i>=s.queue.length){s.finished=true;v.innerHTML=`<div class="panel qbox"><h2>Learn 完成 ✓</h2><p class="muted">这一阶段只负责主动回忆，不需要输入答案。接下来进入 Practice，开始根据 definition 写出 term。</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn primary" id="goPractice">继续 Practice →</button><button class="btn ghost" onclick="setMode('home')">返回 Overview</button><button class="btn ghost" id="redoLearn">再练一轮 Learn</button></div></div>`;document.getElementById('goPractice').onclick=()=>{session.practice=null;setMode('practice')};document.getElementById('redoLearn').onclick=()=>{session.learn={deckId:d.id,queue:shuffle(d.cards).map((c,i)=>({card:c,side:i%2===0?'term':'def'})),i:0,flipped:false,finished:false};render()};return}const item=s.queue[s.i],c=item.card;const front=item.side==='term'?c.term:c.def;const back=item.side==='term'?c.def:c.term;const backImg=item.side==='term'?c.image:'';const frontImg=item.side==='def'?c.image:'';const prompt=item.side==='term'?'看到 Term，先在脑中想 Definition':'看到 Definition，先在脑中想 Term';v.innerHTML=`<div class="flash-wrap"><div style="width:min(760px,100%)"><div class="progress"><div style="width:${((s.i+1)/s.queue.length)*100}%"></div></div><div class="muted" style="margin:10px 0;text-align:center">Learn · ${s.i+1}/${s.queue.length} · ${prompt}</div><div class="flash ${s.flipped?'flipped':''}" id="learnCard"><div class="flash-inner"><div class="face front"><div class="face-content"><div>${esc(front)}</div>${frontImg?`<img class="def-image" src="${frontImg}" alt="Definition image">`:''}${item.side==='term'?speakerButton(c.term):''}<div class="speech-note">先自己想答案，再翻面</div></div></div><div class="face back"><div class="face-content"><div>${esc(back)}</div>${backImg?`<img class="def-image" src="${backImg}" alt="Definition image">`:''}${speakerButton(c.term)}<div class="speech-note">答案</div></div></div></div></div><div class="flash-controls"><button class="pill" id="learnPrev">← 上一张</button><button class="pill" id="learnNext">${s.i===s.queue.length-1?'完成 Learn →':'下一张 →'}</button></div></div></div>`;bindSpeakers(v);document.getElementById('learnCard').onclick=()=>{playSound('flip');s.flipped=!s.flipped;render()};document.getElementById('learnPrev').onclick=()=>{if(s.i>0)s.i--;s.flipped=false;render()};document.getElementById('learnNext').onclick=()=>{s.i++;s.flipped=false;if(s.i>=s.queue.length)s.finished=true;render()}}
function normalizeAnswer(x){return (x||'').trim().toLowerCase().replace(/[\s\-–—_.,;:()\[\]{}'"/\\]+/g,'')}
function renderPractice(v,d){let s=session.practice;if(!s||s.deckId!==d.id){session.practice=s={deckId:d.id,round:1,queue:shuffle(d.cards),i:0,nextRound:[],feedback:null,done:false}}if(s.done){v.innerHTML=`<div class="panel qbox"><h2>Practice 全部答对 🎉</h2><p class="muted">你已经把这一组所有术语都至少正确写出一次。现在进入 Test。</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn primary" id="goTest">进入 Test →</button><button class="btn ghost" onclick="setMode('home')">返回 Overview</button></div></div>`;document.getElementById('goTest').onclick=()=>{session.test=null;setMode('test')};return}if(s.i>=s.queue.length){if(s.nextRound.length){s.round++;s.queue=shuffle(s.nextRound);s.nextRound=[];s.i=0;s.feedback=null;toast(`第 ${s.round} 轮：只练上一轮错题`)}else{s.done=true;render();return}}const c=s.queue[s.i];if(s.feedback){v.innerHTML=`<div class="panel qbox"><div class="muted">Practice · Round ${s.round} · ${s.i+1}/${s.queue.length}</div><div class="review-item no"><b>✗ 正确答案</b><div style="font-size:28px;font-weight:800;margin-top:10px">${esc(c.term)} ${speakerButton(c.term,'speak-inline')}</div><div class="muted" style="margin-top:8px">${esc(c.def)}</div><div class="muted" style="margin-top:8px">你的答案：${esc(s.feedback.answer||'（空白）')}</div></div><button class="btn primary" id="practiceContinue" style="margin-top:14px">继续</button></div>`;bindSpeakers(v);document.getElementById('practiceContinue').onclick=()=>{s.feedback=null;s.i++;render()};return}v.innerHTML=`<div class="panel qbox"><div class="progress"><div style="width:${(s.i/s.queue.length)*100}%"></div></div><div class="muted" style="margin-top:10px">Practice · Round ${s.round} · ${s.i+1}/${s.queue.length}</div><div class="qtitle">根据 Definition 写出 Term</div><div class="review-item" style="font-size:20px;line-height:1.6">${esc(c.def)}${c.image?`<div style="margin-top:12px"><img class="def-image" src="${c.image}" alt="Definition image"></div>`:''}</div><input id="practiceInput" class="input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入英文术语" style="margin-top:14px;font-size:20px"><button class="btn primary" id="checkPractice" style="margin-top:10px">提交</button><div class="muted" style="margin-top:10px">答对的卡片不会再出现；答错的会在本轮全部完成后进入下一轮。</div></div>`;const input=document.getElementById('practiceInput');input.focus();const check=()=>{const ans=input.value;const ok=normalizeAnswer(ans)===normalizeAnswer(c.term);mark(c,ok,d);if(ok){s.i++;render()}else{if(!s.nextRound.some(x=>x.id===c.id))s.nextRound.push(c);s.feedback={answer:ans};render()}};document.getElementById('checkPractice').onclick=check;input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check()}}}
function renderTest(v,d){let s=session.test;if(!s||s.deckId!==d.id){const qs=shuffle(d.cards).map((c,i)=>({card:c,type:(d.cards.length>=4&&i%2===0)?'mcq':'written',answer:null,correct:null}));session.test=s={deckId:d.id,questions:qs,i:0,finished:false}}if(s.finished){const score=s.questions.filter(q=>q.correct).length;v.innerHTML=`<div class="panel qbox"><div class="muted">Test Result</div><div class="score">${score}/${s.questions.length}</div><div class="muted">${Math.round(score/s.questions.length*100)}%</div>${s.questions.filter(q=>!q.correct).map(q=>`<div class="review-item no"><b>✗ ${esc(q.card.term)}</b><div style="margin-top:6px">${esc(q.card.def)}</div>${q.answer?`<div class="muted" style="margin-top:4px">你的答案：${esc(q.answer)}</div>`:''}</div>`).join('')}<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn primary" id="goMatch">继续 Match →</button><button class="btn ghost" onclick="setMode('home')">返回 Overview</button><button class="btn ghost" onclick="session.test=null;render()">重新 Test</button></div></div>`;document.getElementById('goMatch').onclick=()=>{session.match=null;setMode('match')};return}const q=s.questions[s.i],c=q.card;v.innerHTML=`<div class="panel qbox"><div class="progress"><div style="width:${s.i/s.questions.length*100}%"></div></div><div class="muted" style="margin-top:10px">Test · Question ${s.i+1}/${s.questions.length} · ${q.type==='mcq'?'Multiple choice':'Written'}</div><div class="qtitle">${esc(c.term)} ${speakerButton(c.term,'speak-inline')}</div>${q.type==='mcq'?`<div class="options">${mkMCQ(c,d).map(o=>`<button class="option" data-answer="${encodeURIComponent(o)}">${esc(o)}</button>`).join('')}</div>`:`<textarea id="testInput" class="input textarea" placeholder="写出 definition 的关键词或主要意思"></textarea><button class="btn primary" id="submitTest" style="margin-top:10px">提交</button>`}</div>`;bindSpeakers(v);const finish=(ans,ok)=>{q.answer=ans;q.correct=ok;mark(c,ok,d);s.i++;if(s.i>=s.questions.length)s.finished=true;render()};if(q.type==='mcq'){document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{const ans=decodeURIComponent(b.dataset.answer);finish(ans,ans===c.def)})}else document.getElementById('submitTest').onclick=()=>{const ans=document.getElementById('testInput').value.trim();const low=ans.toLowerCase();const parts=c.def.toLowerCase().split(/[，。；;,\n:：]/).map(x=>x.trim()).filter(x=>x.length>2);const ok=low.length>1&&parts.some(k=>k.includes(low)||low.includes(k));finish(ans,ok)}}
function renderMatch(v,d){let s=session.match;if(!s||s.deckId!==d.id||s.done){const cards=shuffle(d.cards).slice(0,Math.min(6,d.cards.length));const items=shuffle(cards.flatMap(c=>[{id:c.id,type:'term',text:c.term},{id:c.id,type:'def',text:c.def}]));session.match=s={deckId:d.id,items,selected:null,doneIds:[],moves:0,done:false}}const remaining=s.items.filter(x=>!s.doneIds.includes(x.id)||!s.doneIds.includes(x.id+'done'));v.innerHTML=`<div class="panel"><div class="muted">Match · 点一个术语，再点它对应的定义</div><h2>${s.done?'完成 🎉':`已配对 ${s.doneIds.length/2} / ${s.items.length/2}`}</h2><div class="match-grid">${s.items.map((it,idx)=>`<button class="match-item ${s.doneIds.includes(idx)?'done':''} ${s.selected===idx?'selected':''}" data-i="${idx}">${esc(it.text)}</button>`).join('')}</div>${s.done?'<button class="btn primary" style="margin-top:12px" onclick="session.match=null;render()">再玩一次</button>':''}</div>`;if(!s.done)document.querySelectorAll('.match-item:not(.done)').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(s.selected===null){s.selected=i;render();return}const a=s.items[s.selected],bb=s.items[i];if(s.selected!==i&&a.id===bb.id&&a.type!==bb.type){s.doneIds.push(s.selected,i);const c=d.cards.find(x=>x.id===a.id);mark(c,true,d)}else{const c=d.cards.find(x=>x.id===a.id);if(c)mark(c,false,d)}s.selected=null;s.moves++;if(s.doneIds.length===s.items.length)s.done=true;render()})}
function renderMistakes(v,d){const cards=d.stats.mistakes.map(id=>d.cards.find(c=>c.id===id)).filter(Boolean);if(!cards.length){v.innerHTML='<div class="panel empty">目前没有错题 🎉<br><span class="muted">在 Learn / Practice / Test 中答错的卡片会自动出现在这里。</span></div>';return}v.innerHTML=`<div class="panel"><h2 style="margin-top:0">错题复习</h2><p class="muted">${cards.length} 张需要加强。</p>${cards.map(c=>`<div class="review-item no"><b>${esc(c.term)}</b>${speakerButton(c.term,'speak-inline')}<div style="margin-top:6px">${esc(c.def)}</div>${c.image?`<div style="margin-top:10px"><img class="def-image" src="${c.image}" alt="Definition image"></div>`:''}</div>`).join('')}<button class="btn primary" style="margin-top:14px" id="mistakeLearn">用错题开始 Learn</button></div>`;document.getElementById('mistakeLearn').onclick=()=>{session.learn={deckId:d.id,queue:shuffle(cards),i:0,done:false};setMode('learn')}}


function renderExam(v,d){
  d.exams=d.exams||[];
  let s=session.exam;
  if(!s||s.deckId!==d.id){session.exam=s={deckId:d.id,order:shuffle(d.exams),i:0,revealed:false}}
  if(!d.exams.length){v.innerHTML=`<div class="panel qbox"><h2>Exam 区域</h2><p class="muted">这里是独立于单词学习流程的课程考试区。可以放 short-answer、concept explanation、application question、case question 等。</p><button class="btn primary" id="editExamEmpty">＋ 添加考试题</button></div>`;document.getElementById('editExamEmpty').onclick=openExamEdit;return}
  if(s.i>=s.order.length){v.innerHTML=`<div class="panel qbox"><h2>Exam 完成 ✓</h2><p class="muted">这一轮所有课程题目都练完了。</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="redoExam">重新随机一轮</button><button class="btn ghost" onclick="setMode('home')">返回 Overview</button><button class="btn ghost" id="editExamDone">编辑考试题</button></div></div>`;document.getElementById('redoExam').onclick=()=>{session.exam={deckId:d.id,order:shuffle(d.exams),i:0,revealed:false};render()};document.getElementById('editExamDone').onclick=openExamEdit;return}
  const q=s.order[s.i];
  v.innerHTML=`<div class="panel qbox"><div class="progress"><div style="width:${((s.i+1)/s.order.length)*100}%"></div></div><div class="muted" style="margin-top:10px">Course Exam · ${s.i+1}/${s.order.length}</div><div class="exam-q" style="margin-top:18px">${esc(q.q)}</div>${s.revealed?`<div class="exam-answer"><b>参考答案</b><div style="margin-top:8px">${esc(q.answer)}</div></div>`:'<p class="muted" style="margin-top:14px">先自己口头或在纸上作答，再显示参考答案。</p>'}<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">${s.revealed?'<button class="btn primary" id="nextExam">下一题 →</button>':'<button class="btn primary" id="revealExam">显示参考答案</button>'}<button class="btn ghost" id="editExamBtn">编辑考试题</button><button class="btn ghost" onclick="setMode('home')">返回</button></div></div>`;
  if(!s.revealed)document.getElementById('revealExam').onclick=()=>{s.revealed=true;render()};
  else document.getElementById('nextExam').onclick=()=>{s.i++;s.revealed=false;render()};
  document.getElementById('editExamBtn').onclick=openExamEdit;
}
function openExamEdit(){const d=deck();d.exams=d.exams||[];examRows.innerHTML=d.exams.map(q=>`<div class="exam-editor-row" data-id="${q.id}"><textarea class="input eq" placeholder="考试题目">${esc(q.q)}</textarea><textarea class="input ea" placeholder="参考答案">${esc(q.answer)}</textarea><button class="btn danger edel">删除</button></div>`).join('');examRows.querySelectorAll('.exam-editor-row').forEach(row=>{const id=row.dataset.id;row.querySelector('.eq').oninput=e=>{d.exams.find(x=>x.id===id).q=e.target.value;save()};row.querySelector('.ea').oninput=e=>{d.exams.find(x=>x.id===id).answer=e.target.value;save()};row.querySelector('.edel').onclick=()=>{d.exams=d.exams.filter(x=>x.id!==id);save();openExamEdit()}});examDialog.showModal()}

// UI events
document.getElementById('soundBtn').onclick=()=>{soundEnabled=!soundEnabled;localStorage.setItem('psycard-sound',soundEnabled?'on':'off');updateSoundBtn();if(soundEnabled)playSound('correct');toast(soundEnabled?'音效已开启':'音效已关闭')};
document.getElementById('modebar').querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.getElementById('newDeckBtn').onclick=()=>{newDeckName.value='';newDeckUnit.value='';newDeckImport.value='';deckDialog.showModal()};
document.getElementById('createDeckConfirm').onclick=()=>{const course=newDeckCourse.value||'PSYC1002';const unit=newDeckUnit.value.trim()||'Other';const name=newDeckName.value.trim()||'Untitled Lecture';const cards=parseImport(newDeckImport.value);const id=crypto.randomUUID();state.decks.push({id,course,unit,name,cards,stats:{seen:{},correct:{},wrong:{},mistakes:[]},exams:[]});state.activeDeck=id;save();deckDialog.close();setMode('home');toast('Lecture 卡组已创建')};
function parseImport(txt){return txt.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(line=>{let [term,...rest]=line.split('\t');if(!rest.length){const parts=line.split(/\s{2,}|\s*[-—|]\s*/);term=parts.shift();rest=[parts.join(' ')];}return {id:crypto.randomUUID(),term:(term||'').trim(),def:(rest.join('\t')||'').trim(),image:''}}).filter(c=>c.term&&c.def)}
document.getElementById('editBtn').onclick=()=>openEdit();function openEdit(){const d=deck();editRows.innerHTML=d.cards.map((c,i)=>`<div class="card-row" data-id="${c.id}"><textarea class="input term">${esc(c.term)}</textarea><textarea class="input def">${esc(c.def)}</textarea><div class="img-tools"><div class="img-preview">${c.image?`<img class="def-image" src="${c.image}" alt="Definition image">`:'<span class="muted">Definition 图片</span>'}</div><input class="img-input" type="file" accept="image/*"><button class="btn ghost remove-img" ${c.image?'':'disabled'}>移除图片</button></div><button class="btn danger del">删除</button></div>`).join('');editRows.querySelectorAll('.card-row').forEach(row=>{const id=row.dataset.id,card=d.cards.find(c=>c.id===id);row.querySelector('.term').oninput=e=>{card.term=e.target.value;save()};row.querySelector('.def').oninput=e=>{card.def=e.target.value;save()};row.querySelector('.img-input').onchange=async e=>{const f=e.target.files[0];if(!f)return;card.image=await compressImage(f);try{save();openEdit();toast('图片已添加到 Definition')}catch(err){card.image='';alert('图片太大，无法保存在浏览器中。请换一张更小的图片。')}};row.querySelector('.remove-img').onclick=()=>{card.image='';save();openEdit()};row.querySelector('.del').onclick=()=>{d.cards=d.cards.filter(c=>c.id!==id);save();openEdit()}});editDialog.showModal()}
function compressImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1200,scale=Math.min(1,max/img.width,max/img.height),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);resolve(cv.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
document.getElementById('addCardBtn').onclick=()=>{const d=deck();d.cards.push({id:crypto.randomUUID(),term:'',def:'',image:''});save();openEdit();setTimeout(()=>{const rows=document.querySelectorAll('.card-row');rows[rows.length-1]?.querySelector('.term')?.focus()},0)};
document.getElementById('deleteDeckBtn').onclick=()=>{if(state.decks.length<=1){toast('至少保留一个卡组');return}if(confirm('确定删除当前卡组？')){state.decks=state.decks.filter(d=>d.id!==state.activeDeck);state.activeDeck=state.decks[0].id;save();setMode('home')}};
document.getElementById('shuffleBtn').onclick=()=>{const d=deck();session.flash={deckId:d.id,order:shuffle(d.cards),i:0,flipped:false,finished:false};toast('Flashcards 已随机排序');setMode('flash')};
document.getElementById('addExamBtn').onclick=()=>{const d=deck();d.exams=d.exams||[];d.exams.push({id:crypto.randomUUID(),q:'',answer:''});save();openExamEdit()};
document.getElementById('backupBtn').onclick=()=>backupDialog.showModal();
document.getElementById('appendBtn').onclick=()=>{const cards=parseImport(appendImport.value);deck().cards.push(...cards);appendImport.value='';save();render();toast(`已追加 ${cards.length} 张卡片`)};
document.getElementById('exportJson').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='psycard-backup.json';a.click();URL.revokeObjectURL(a.href)};
document.getElementById('importJson').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x.decks)throw 0;state=x;migrateState();save();backupDialog.close();setMode('home');toast('备份已导入')}catch{alert('这个文件不是有效的 PsyCard 备份')}};
renderSidebar();updateMeta();updateSoundBtn();render();
</script>
</body></html>
